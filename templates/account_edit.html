{% extends 'base.html' %}
{% block title %}アカウントを編集 | PITA_タノム{% endblock %}
{% block content %}<a class="back-link" href="{{ url_for('accounts') }}">← アカウント管理に戻る</a><section class="card edit-card"><span class="eyebrow">EDIT ACCOUNT</span><h1>{{ account.store_name }}</h1><form method="post"><label><span>ログインID</span><input name="login_id" value="{{ account.login_id }}" required minlength="3" maxlength="50" pattern="[A-Za-z0-9_.-]+" autocapitalize="none"></label><label><span>新しいパスワード（再設定）</span><input name="password" type="password" minlength="8" autocomplete="new-password" placeholder="変更しない場合は空欄"><small>現在のパスワードは表示できません。再設定する場合だけ8文字以上で入力してください。</small></label><label><span>新しいパスワード（確認）</span><input name="password_confirmation" type="password" minlength="8" autocomplete="new-password" placeholder="同じパスワードを再入力"></label><div class="action-bar"><a class="button button-secondary" href="{{ url_for('accounts') }}">キャンセル</a><button class="button button-primary" type="submit">変更を保存</button></div></form></section>{% endblock %}
