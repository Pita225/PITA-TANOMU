<article class="master-row"><div>{% if item.parent_name %}<small>{{ item.parent_name }} ＞</small>{% endif %}<strong>{{ item.name }}</strong></div><span class="status-badge {% if item.is_active %}status-active{% else %}status-paused{% endif %}">{% if item.is_active %}有効{% else %}停止中{% endif %}</span><div class="master-actions"><a class="small-button" href="{{ url_for('edit_category', category_id=item.id) }}">編集</a><form action="{{ url_for('toggle_category', category_id=item.id) }}" method="post"><button class="small-button {% if item.is_active %}button-pause{% else %}button-resume{% endif %}" type="submit">{% if item.is_active %}停止{% else %}再開{% endif %}</button></form><form action="{{ url_for('delete_category', category_id=item.id) }}" method="post"><button class="small-button button-danger" type="submit">削除</button></form></div></article>
